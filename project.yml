name: NianRi
options:
  bundleIdPrefix: com.nianri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  NianRi:
    type: application
    platform: iOS
    sources:
      - path: NianRi
        excludes:
          - Info.plist
          - NianRi.entitlements
      - path: NianRiShared
    dependencies:
      - target: NianRiWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nianri.app
        PRODUCT_NAME: NianRi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: NianRi/Info.plist
        CODE_SIGN_ENTITLEMENTS: NianRi/NianRi.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  NianRiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NianRiWidget
        excludes:
          - Info.plist
          - NianRiWidget.entitlements
      - path: NianRiShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nianri.app.widget
        PRODUCT_NAME: NianRiWidget
        INFOPLIST_FILE: NianRiWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NianRiWidget/NianRiWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

