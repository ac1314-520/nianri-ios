name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "NianRi/**"
      - "NianRiWidget/**"
      - "NianRiShared/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/ios-unsigned.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NianRi IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project NianRi.xcodeproj \
            -scheme NianRi \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          {
            echo "### xcodebuild errors"
            echo '```'
            grep -nE "error:|BUILD FAILED|The following build commands failed" build.log | tail -80 || tail -100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure log
        if: failure()
        run: |
          cp build.log ci-build.log
          git config user.name "NianRi CI"
          git config user.email "ci@nianri.local"
          git add ci-build.log
          git commit -m "ci: capture iOS build failure" || true
          git push || true

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/NianRi.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" NianRi/Info.plist)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/NianRi.app"
          rm -f "NianRi-${VERSION}-unsigned.ipa"
          (cd build && zip -qry "../NianRi-${VERSION}-unsigned.ipa" Payload)
          ls -lh "NianRi-${VERSION}-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NianRi-iOS-${{ env.VERSION }}-unsigned
          path: NianRi-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="NianRi-${VERSION}-unsigned.ipa"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$IPA" \
              --title "念日 iOS ${VERSION}" \
              --notes "无签名 IPA。下载后请用全能签签名安装。"
          fi
